name: Crawl sources

on:
  schedule:
    # 03:00 UTC daily = 08:30 IST. Edit the cron string to change timing.
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # adds a manual "Run workflow" button on GitHub — this is your "check now"

permissions:
  contents: write
  issues: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests anthropic

      - name: Run crawler
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/crawl.py

      - name: Open summary issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/report_issue.py

      - name: Commit updated index
        run: |
          git config user.name "archive-bot"
          git config user.email "archive-bot@users.noreply.github.com"
          git add data/index.json data/last_run.json
          git diff --quiet --cached || git commit -m "Update archive index"
          git push
